# --- MY PROGRAMS ---

$terminal = kitty
$fileManager = nautilus -w
$menu = rofi -show drun -show-icons -icon-theme "Papirus"

# --- KEYBINDINGSS ---

$mainMod = SUPER

bind = SUPER, M, exec, hyprctl dispatch resizeactive exact 280 1000
bind = SUPER SHIFT, M, exec, hyprctl dispatch resizeactive exact 1920 1080


# Zoom ON (center)
bind = SUPER, Z, exec, hyprctl keyword decoration:screen_shader ~/.config/hypr/shaders/zoom.frag

# Zoom OFF
bind = SUPER SHIFT, Z, exec, hyprctl keyword decoration:screen_shader ""

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, A, exec, pkill rofi || rofi -show drun
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, code
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod  CONTROL, J, togglesplit, # dwindle
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, F, fullscreen,
bind = $mainMod  SHIFT, L, exec, hyprlock
bind = $mainMod, L, exec, wlogout
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod  SHIFT, E, exec, gnome-characters
bind = $mainMod, H, exec, hyprpicker
bind = $mainMod, D, exec, walker 
bind = $mainMod  SHIFT, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

bind = , PRINT, exec, hyprshot -m output --clipboard-only
bind = SHIFT, PRINT, exec, hyprshot -m output
bind = CTRL, PRINT, exec, hyprshot -m region --clipboard-only   
bind = CTRL SHIFT, PRINT, exec, hyprshot -m region

bind = $mainMod  SHIFT, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod  SHIFT, B, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod  SHIFT, W, exec, ~/.config/hypr/scripts/wallpicker.sh

# --- Move focus ---

bind = $mainMod, j, cyclenext
bind = $mainMod SHIFT, j, cyclenext, prev

# --- Switch workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move active window to a workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace 
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# bindle = , XF86MonBrightnessUp, exec, brightnessctl s +2%
# bindle = , XF86MonBrightnessDown, exec, brightnessctl s 2%-
# bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 3%+
# bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-


bindle = , XF86MonBrightnessUp, exec, brightnessctl set +2% && ~/.config/hypr/scripts/brightness_volume_osd.sh brightness
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 2%- &&  ~/.config/hypr/scripts/brightness_volume_osd.sh brightness

bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 3%+ && ~/.config/hypr/scripts/brightness_volume_osd.sh volume
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%- && ~/.config/hypr/scripts/brightness_volume_osd.sh volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Zoom in/out with Ctrl+Super + scroll ---
bind = Ctrl+Super, mouse_up,   exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}")
bind = Ctrl+Super, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}")



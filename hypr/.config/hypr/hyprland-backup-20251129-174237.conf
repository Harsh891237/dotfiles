
# ---  Source Files ---

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/colors.conf

# --- MONITORS ---

monitor   = eDP-1,1920x1080@60,auto,1

# --- AUTOSTART ---

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = quickshell --config ~/.config/quickshell
# exec-once = waybar
exec-once = blueman-applet
exec-once = [workspace 1 silent] zen-browser
exec-once = swww-daemon
exec-once = hypridle
exec-once = swaync
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Tela-black'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark' 
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = hyprctl setcursor macOS 27

# --- ENVIRONMENT VARIABLES ---

env = GTK_THEME, adw-gtk3-dark
env = HYPRCURSOR_THEME, macOS
env = HYPRCURSOR_SIZE, macOS
env = XCURSOR_THEME, macOS
env = XCURSOR_SIZE, 24

# xdg specifications
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# toolkit backends
env = GDK_BACKEND, wayland,x11,*
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# qt 
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- LOOK AND FEEL ---

general { 
    gaps_in = 5
    gaps_out = 12

    border_size = 1

    col.active_border = rgba(44474fff)
    col.inactive_border = rgba(262626ff)
    resize_on_border = false 
    allow_tearing = true
    layout = scrolling 

    snap {
	enabled = true
    }
}

dwindle {
    special_scale_factor = 0.96
}

decoration {
    rounding = 12
    rounding_power = 2
    shadow {
	enabled = yes
        ignore_window = true
        range = 13
        offset = 2 3
        render_power = 3
        color = rgba(0, 0, 0, 0.7)
	}
    blur {
	enabled = yes
        size = 8
        passes = 3
        ignore_opacity = true

        noise = 0.085
        contrast = 1.6
        brightness = 0.85

        xray = false
        new_optimizations = true 
    }
}

#--- PLUGINS ---
plugin {
    hyprscrolling {
	column_width = 0.69
	fullscreen_on_one_column = true
	focus_fit_method = 1
    }
}


animations {
    enabled = yes

    bezier = myBezier,   0.05, 0.90, 0.10, 1.05
    bezier = curve,      0.25, 0.70, 0.01, 1.00
    bezier = myBezier2,  0.10, 1.15, 0.15, 1.00
    bezier = decel,      0.05, 0.70, 0.10, 1.00

    # animation = windows,        1, 4.0,  myBezier2, popin 75% 
    animation = windows,        1, 2.5,  decel, slide
    animation = border,         1, 10,   default
    animation = fade,           1, 7.0,  default
    animation = workspaces,     1, 2.5,  decel,     slidefadevert 15%
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    vrr = 0 
    force_default_wallpaper = 0
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}

xwayland {
    force_zero_scaling = true
}

# --- INPUT ---

input {
    kb_layout = us 
    follow_mouse = 1 
    sensitivity = 0.5
    force_no_accel = true
    touchpad {
        natural_scroll = true
    }
 
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# --- GESTURES ---

gestures {
    gesture = 3, vertical, workspace
}

# --- WINDOW RULES AND LAYER RULES --- 

windowrulev2 =  opacity 0.80 0.80 ,class:^(Alacritty)$
windowrulev2 =  opacity 0.95 0.93 ,class:^(foot)$
windowrulev2 =  opacity 1.00 0.98 ,class:^(Google-chrome)$
windowrulev2 =  opacity 0.99 0.99 ,class:^(Code)$
windowrulev2 =  opacity 0.99 0.98 ,class:^(org.gnome.Nautilus)$
windowrulev2 =  opacity 1.00 1.00 ,class:^(firefox)$
windowrulev2 =  opacity 1.00 1.00 ,class:^(zen)$

windowrulev2 =  float, size 65% 70%, class:^(org.gnome.Characters)$
windowrulev2 =  size 65% 70%, class:^(org.gnome.Characters)$
windowrulev2 =  float, class:^(java)$
windowrulev2 =  size 65% 70%, class:^(java)$
windowrulev2 =  float, class:^(blueman-manager)$
windowrulev2 =  size 40% 60%, class:^(blueman-manager)
windowrulev2 =  float, class:^(nwg-look)$
windowrulev2 =  size 55% 85%, title:^(nwg-look)
windowrulev2 =  size 40% 75%, title:^(Pick a Font)$

windowrulev2 =  float, class:^(xdg-desktop-portal-gtk)$         # -- For the Popups --
windowrulev2 =  size 60% 80%, class:^(xdg-desktop-portal-gtk)
windowrulev2 =  float, class:^(org.gnome.Calendar)$
windowrulev2 =  size 80% 75%, class:^(org.gnome.Calendar)
windowrulev2 =  float, class:^(Minecraft* 1.21.3)$
windowrulev2 =  float, class:^(Waydroid)$
windowrulev2 =  float, class:^(Tk)$
windowrulev2 =  float, class:^(org.gnome.Calculator)$
windowrulev2 =  size 30% 80%, class:^(org.gnome.Calculator)$

windowrulev2 = rounding 0, class:^(waybar)$
windowrulev2 = nofocus, class:^(waybar)$
windowrulev2 = noshadow, class:^(waybar)$

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = noblur, class:^()$, title:^()$

windowrule = rounding 0, class:^(Waydroid)$ 

# -- Blur swaync --
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

# -- Blur Rofi --
layerrule = dimaround, rofi
layerrule = animation popin 95%, rofi
# layerrule = blur, rofi

# -- Blur wlogout --
layerrule = blur, logout_dialog 
layerrule = ignorealpha 0.6, logout_dialog



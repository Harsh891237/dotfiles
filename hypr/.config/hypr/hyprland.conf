
# ---  Source Files ---

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/colors.conf

# --- MONITORS ---

monitor   = eDP-1,1920x1080@60,auto,1

# --- AUTOSTART ---

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = quickshell --config ~/.config/quickshell
# exec-once = waybar
exec-once = blueman-applet
exec-once = [workspace 1 silent] zen-browser
exec-once = awww-daemon
exec-once = hypridle
exec-once = swaync
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Everforest-Dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = hyprctl setcursor macOS 27

# --- ENVIRONMENT VARIABLES ---

#env = GTK_THEME, Everforest-Dark
env = QS_ICON_THEME, Papirus
env = HYPRCURSOR_THEME, macOS
env = HYPRCURSOR_SIZE, macOS
env = XCURSOR_THEME, macOS
env = XCURSOR_SIZE, 24

# xdg specifications
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# toolkit backends
env = GDK_BACKEND, wayland,x11,*
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# qt 
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- LOOK AND FEEL ---

general { 
    gaps_in = 5
    gaps_out = 12

    border_size = 1

    col.active_border = rgba(44474fff)
    col.inactive_border = rgba(262626ff)
    resize_on_border = false 
    allow_tearing = true
    layout = dwindle 

    snap {
	enabled = true
    }
}

#--- PLUGINS ---
plugin {
    hyprscrolling {
        column_width = 0.65
        fullscreen_on_one_column = true
	focus_fit_method = 1
    }
}

dwindle {
    special_scale_factor = 0.96
}

decoration {
    rounding = 12
    rounding_power = 2
    shadow {
	enabled = yes
        ignore_window = true
        range = 13
        offset = 2 3
        render_power = 3
        color = rgba(0, 0, 0, 0.7)
	}
    blur {
	enabled = yes
        size = 8
        passes = 3
        ignore_opacity = true

        noise = 0.085
        contrast = 1.6
        brightness = 0.85

        xray = false
        new_optimizations = true 
    }
}


animations {
    enabled = yes

    bezier = myBezier,   0.05, 0.90, 0.10, 1.05
    bezier = curve,      0.25, 0.70, 0.01, 1.00
    bezier = myBezier2,  0.10, 1.15, 0.15, 1.00
    bezier = decel,      0.05, 0.70, 0.10, 1.00

    # animation = windows,        1, 4.0,  myBezier2, popin 75% 
    animation = windows,        1, 2.5,  decel, slide
    animation = border,         1, 10,   default
    animation = fade,           1, 7.0,  default
    animation = workspaces,     1, 3,  decel,     slidefadevert 15%
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    vrr = 0 
    force_default_wallpaper = 0
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}

xwayland {
    force_zero_scaling = true
}

# --- INPUT ---

input {
    kb_layout = us 
    follow_mouse = 1 
    sensitivity = 0.5
    force_no_accel = true
    touchpad {
        natural_scroll = true
    }
 
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# --- GESTURES ---

gestures {
    gesture = 3, vertical, workspace
}

# --- WINDOW RULES ---

# Opacity
windowrule = opacity 0.8 0.8,	match:class ^(Alacritty)$
windowrule = opacity 0.95 0.93, match:class ^(foot)$
windowrule = opacity 0.95 0.80,	match:class ^(google-chrome)$
windowrule = opacity 0.99 0.99, match:class ^(Code)$
windowrule = opacity 0.99 0.98, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.7 0.90, 	match:class ^(firefox)$
windowrule = opacity 1.0 1.0, 	match:class ^(zen)$

# Float & Size
windowrule = float 1, center on, 		match:class ^(Minecraft.*)$

windowrule = float 1, center on, size 1250 750, match:class ^(org.gnome.Characters)$

windowrule = float 1, center on, size 1250 750, match:class ^(java)$

windowrule = float 1, center on, size 850 650,  match:class ^(blueman-manager)$

windowrule = float 1, center on, size 1300 850, match:class ^(nwg-look)$
windowrule = float 1, center on, size 1000 750, match:title ^(Pick a Font)$

windowrule = float 1, center on, size 1530 860, match:class ^(org.gnome.Calendar)$

windowrule = float 1, center on, size 1250 680, match:class ^(xdg-desktop-portal-gtk)$

windowrule = float 1, match:class ^(Waydroid)$
windowrule = float 1, match:class ^(Tk)$

windowrule = float 1, center on, size 580 860, match:class ^(org.gnome.Calculator)$

# Waybar 
windowrule = rounding 0, match:class ^(waybar)$
windowrule = no_focus on, match:class ^(waybar)$
windowrule = no_focus on, match:class ^(waybar)$

# Global / System
windowrule = suppress_event maximize, match:class .*

windowrule = no_blur on, match:class ^()$ match:title ^()$

windowrule = rounding 0, match:class ^(Waydroid)$


# --- LAYER RULES ---

# Blur swaync
layerrule = blur on,			match:namespace  ^(swaync-control-center)$
layerrule = blur on,			match:namespace  ^(swaync-notification-window)$
layerrule = ignore_alpha 0,		match:namespace  ^(swaync-control-center)$
layerrule = ignore_alpha 0,		match:namespace  ^(swaync-notification-window)$
layerrule = ignore_alpha 0.5,		match:namespace  ^(swaync-control-center)$
layerrule = ignore_alpha 0.5,		match:namespace  ^(swaync-notification-window)$

# Blur Rofi
layerrule = dim_around on, 	 	match:namespace ^(rofi)$
layerrule = animation popin 95%, 	match:namespace ^(rofi)$

# Blur wlogout
layerrule = blur on, 	       		match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 0.6,  		match:namespace ^(logout_dialog)$

# HyprEmoji config
source = ~/.config/hypremoji/hypremoji.conf
